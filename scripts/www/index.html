<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>工资管理 - 个人财务助手</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // 提前加载保存的主题，避免页面闪烁
        (function() {
            const savedTheme = localStorage.getItem('salary_theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        /* 可折叠组件样式 */
        .collapsible-section {
            margin-bottom: 20px;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: var(--bg-card);
            box-shadow: var(--shadow-sm);
        }
        
        .collapsible-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
            border-bottom: 1px solid transparent;
        }
        
        .collapsible-header:hover {
            background: var(--bg-tertiary);
        }
        
        .collapsible-section.expanded .collapsible-header {
            border-bottom-color: var(--border-color);
        }
        
        .collapsible-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .collapsible-icon-left {
            color: var(--primary);
            font-size: 1rem;
            width: 20px;
            text-align: center;
        }
        
        .collapsible-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .collapsible-header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .collapsible-value {
            font-size: 0.85rem;
            color: var(--text-tertiary);
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .collapsible-arrow {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .collapsible-section.expanded .collapsible-arrow {
            transform: rotate(180deg);
        }
        
        .collapsible-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .collapsible-body.expanded {
            max-height: 500px;
        }
        
        .collapsible-body-content {
            padding: 16px;
            padding-top: 8px;
        }
        
        .collapsible-body-content .form-group:last-child {
            margin-bottom: 0;
        }
        
        /* 添加记录页面美化 - 优化布局 */
        .modal-body {
            padding: 20px;
        }
        
        .modal-body .form-group {
            margin-bottom: 16px;
        }
        
        .modal-body .form-label {
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--text-secondary);
            font-weight: 600;
        }
        
        .modal-body .form-input,
        .modal-body .form-select {
            height: 44px;
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            border: 2px solid var(--border-color);
            transition: all 0.3s ease;
        }
        
        .modal-body .form-input:focus,
        .modal-body .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .modal-body .form-textarea {
            min-height: 80px;
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            border: 2px solid var(--border-color);
            transition: all 0.3s ease;
        }
        
        .modal-body .form-textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        /* 可折叠组件优化 - 更清爽的设计 */
        .collapsible-section {
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-card);
            box-shadow: var(--shadow-sm);
        }
        
        .collapsible-header {
            padding: 12px 16px;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            transition: all 0.3s ease;
        }
        
        .collapsible-section.expanded .collapsible-header {
            border-radius: var(--radius-md) var(--radius-md) 0 0;
            border-bottom: 1px solid var(--border-color);
        }
        
        .collapsible-header:hover {
            background: var(--bg-tertiary);
        }
        
        .collapsible-title {
            font-size: 0.9rem;
            font-weight: 600;
        }
        
        .collapsible-value {
            font-size: 0.8rem;
            max-width: 160px;
        }
        
        .collapsible-icon-left {
            font-size: 0.9rem;
            width: 18px;
        }
        
        .collapsible-arrow {
            font-size: 0.7rem;
        }
        
        .collapsible-body-content {
            padding: 16px;
            background: var(--bg-card);
        }
        
        .collapsible-body-content .form-group {
            margin-bottom: 12px;
        }
        
        .collapsible-body-content .form-group:last-child {
            margin-bottom: 0;
        }
        
        /* 实发工资卡片优化 - 更醒目的设计 */
        .modal-body .card {
            margin-top: 16px;
            padding: 20px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-card));
            border: 1px solid var(--border-color);
        }
        
        #previewSalary {
            font-size: 1.8rem !important;
            font-weight: 800;
            background: linear-gradient(135deg, var(--success), #38a169);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* 图片上传区域优化 */
        .image-upload-area {
            padding: 32px 24px;
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-md);
            text-align: center;
            transition: all 0.3s ease;
            background: var(--bg-primary);
            cursor: pointer;
        }
        
        .image-upload-area:hover {
            border-color: var(--primary);
            background: rgba(102, 126, 234, 0.05);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }
        
        .image-preview-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 12px;
        }
        
        .image-preview-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: var(--radius-sm);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
        }
        
        .image-preview-item:hover {
            transform: scale(1.02);
            box-shadow: var(--shadow-md);
        }
        
        .image-preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .image-remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(245, 101, 101, 0.9);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            transition: all 0.2s ease;
        }
        
        .image-remove-btn:hover {
            background: var(--danger);
            transform: scale(1.1);
        }
        
        /* 模态框底部按钮优化 - 对称设计 */
        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border-light);
            display: flex;
            gap: 12px;
            background: var(--bg-card);
        }
        
        .modal-footer .btn {
            flex: 1;
            height: 44px;
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .modal-footer .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        
        .modal-footer .btn-secondary:hover {
            background: var(--bg-primary);
            border-color: var(--text-tertiary);
        }
        
        .modal-footer .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            box-shadow: 0 4px 12px -4px rgba(102, 126, 234, 0.4);
        }
        
        .modal-footer .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px -4px rgba(102, 126, 234, 0.5);
        }
        
        .modal-footer .btn-primary:active {
            transform: translateY(0);
        }
        
        /* 响应式优化 */
        @media (max-width: 480px) {
            .modal-body {
                padding: 16px;
            }
            
            .modal-body .form-group {
                margin-bottom: 12px;
            }
            
            .image-preview-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
            
            .modal-footer {
                padding: 12px 16px;
                gap: 8px;
            }
            
            .modal-footer .btn {
                height: 40px;
                font-size: 0.9rem;
            }
        }
        
        /* 日期输入框优化 */
        .date-input-wrapper .form-input {
            background-size: 18px;
            background-position: right 10px center;
            padding-right: 36px;
        }
        
        /* 错误提示优化 */
        .error-message {
            font-size: 0.8rem;
            margin-top: 4px;
            color: var(--danger);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .error-message::before {
            content: "⚠";
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <!-- 应用容器 -->
    <div id="app" class="app-container">

        <!-- 主内容区域 -->
        <main class="main-content" id="mainContent">
            <!-- 页面内容将通过JavaScript动态加载 -->
        </main>

    <!-- 底部导航栏 -->
    <nav class="bottom-nav" id="bottomNav">
        <button class="nav-item active" data-page="home" aria-label="首页">
            <i class="fas fa-home nav-icon"></i>
            <span class="nav-label">首页</span>
        </button>
        <button class="nav-item" data-page="records" aria-label="记录">
            <i class="fas fa-list-alt nav-icon"></i>
            <span class="nav-label">记录</span>
        </button>
        <button class="nav-item" data-page="notes" aria-label="笔记">
            <i class="fas fa-sticky-note nav-icon"></i>
            <span class="nav-label">笔记</span>
        </button>
        <button class="nav-item" data-page="statistics" aria-label="统计">
            <i class="fas fa-chart-pie nav-icon"></i>
            <span class="nav-label">统计</span>
        </button>
        <button class="nav-item" data-page="profile" aria-label="我的">
            <i class="fas fa-user nav-icon"></i>
            <span class="nav-label">我的</span>
        </button>
    </nav>
    </div>

    <!-- 加载骨架屏 -->
    <div class="skeleton-overlay" id="skeletonOverlay">
        <div class="skeleton-card">
            <div class="skeleton-line w60"></div>
            <div class="skeleton-line w80"></div>
            <div class="skeleton-line w40"></div>
        </div>
    </div>

    <!-- 弹窗容器 -->
    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="modal-container" id="modalContainer"></div>

    <!-- Toast通知容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- 脚本加载 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <script src="js/crypto.js"></script>
    <script src="js/db.js"></script>
    <script src="js/export.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
